name: Build APK Anton POS

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Build Capacitor Android
        run: |
          pnpm add -D @capacitor/cli @capacitor/core @capacitor/android
          # pakai dist atau dist/public otomatis
          WEB_DIR="dist"
          if [ -d "dist/public" ]; then WEB_DIR="dist/public"; fi
          echo "Using web dir: $WEB_DIR"
          if [ ! -f capacitor.config.ts ] && [ ! -f capacitor.config.json ]; then
            npx cap init "Anton Service POS" "com.antonservice.pos" --web-dir=$WEB_DIR --npm-client pnpm
          fi
          if [ ! -d android ]; then npx cap add android; fi
          npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Anton-POS-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
